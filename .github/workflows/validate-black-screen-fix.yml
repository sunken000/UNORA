name: Validate black screen fix

on:
  push:
    branches:
      - agent/fix-black-screen-renderer-lifecycle
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply capture stability patch
        id: patch
        shell: bash
        run: |
          if [ -f .agent/capture-stability.patch ]; then
            git apply --recount --check .agent/capture-stability.patch
            git apply --recount .agent/capture-stability.patch
            rm -rf .agent
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Commit applied capture fix
        if: steps.patch.outputs.applied == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize full-screen media projection"
          git push
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unora-black-screen-fix-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
