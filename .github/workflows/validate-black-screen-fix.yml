name: Validate black screen fix

on:
  push:
    branches:
      - agent/fix-black-screen-renderer-lifecycle
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply app-share compatibility fix
        id: patch
        shell: bash
        run: |
          if [ -f .agent/capture-stability.patch ]; then
            python3 <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/app/unora/MainActivity.kt")
          text = main.read_text()
          old_call = "MediaProjectionConfig.createConfigForDefaultDisplay()"
          new_call = "MediaProjectionConfig.createConfigForUserChoice()"
          if old_call not in text:
              raise SystemExit("default-display projection call not found")
          text = text.replace(old_call, new_call, 1)
          text = text.replace(
              "// App-window projection can stop producing frames while the selected app is fully\n"
              "            // hidden and may move UNORA to the background. Full-display capture is deterministic\n"
              "            // for a watch party: the user can switch apps normally after sharing starts.",
              "// Keep both Android 14+ projection choices available. App-window visibility\n"
              "            // changes are handled by ScreenCaptureManager instead of disabling the feature.",
              1,
          )
          main.write_text(text)

          screen = Path("app/src/main/java/app/unora/capture/ScreenCaptureManager.kt")
          text = screen.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"{label} not found")
              text = text.replace(old, new, 1)

          replace_once(
              "    private var startupRecoveryAttempted = false\n    private val startupRecovery = Runnable(::recoverCaptureSurfaceIfNeeded)",
              "    private var startupRecoveryAttempted = false\n    private var capturedContentVisible: Boolean? = null\n    private val startupRecovery = Runnable(::recoverCaptureSurfaceIfNeeded)",
              "capture visibility field anchor",
          )

          replace_once(
              "\n\n                override fun onStop() {",
              "\n\n                override fun onCapturedContentVisibilityChanged(isVisible: Boolean) {\n"
              "                    mainHandler.post {\n"
              "                        capturedContentVisible = isVisible\n"
              "                        Log.i(TAG, \"capturedContentVisible=$isVisible\")\n"
              "                        if (isVisible && capturedFrameCount == 0L && !startupRecoveryAttempted) {\n"
              "                            mainHandler.removeCallbacks(startupRecovery)\n"
              "                            mainHandler.postDelayed(startupRecovery, VISIBLE_RECOVERY_DELAY_MS)\n"
              "                        }\n"
              "                    }\n"
              "                }\n\n"
              "                override fun onStop() {",
              "visibility callback anchor",
          )

          replace_once(
              "        capturedFrameCount = 0L\n        startupRecoveryAttempted = false\n        onStateChanged(state)",
              "        capturedFrameCount = 0L\n        startupRecoveryAttempted = false\n        capturedContentVisible = null\n        onStateChanged(state)",
              "capture reset anchor",
          )

          replace_once(
              "        if (capturedFrameCount > 0L || startupRecoveryAttempted || captureWidth <= 0 || captureHeight <= 0) return\n        startupRecoveryAttempted = true",
              "        if (capturedFrameCount > 0L || startupRecoveryAttempted || captureWidth <= 0 || captureHeight <= 0) return\n"
              "        // App-window projection may intentionally pause frames while its window is hidden.\n"
              "        if (capturedContentVisible == false) {\n"
              "            Log.i(TAG, \"capture recovery deferred: selected app is not visible\")\n"
              "            mainHandler.postDelayed(startupRecovery, HIDDEN_CONTENT_RECHECK_MS)\n"
              "            return\n"
              "        }\n"
              "        startupRecoveryAttempted = true",
              "capture recovery anchor",
          )

          replace_once(
              "        const val STARTUP_RECOVERY_DELAY_MS = 2_500L",
              "        const val STARTUP_RECOVERY_DELAY_MS = 2_500L\n"
              "        const val VISIBLE_RECOVERY_DELAY_MS = 900L\n"
              "        const val HIDDEN_CONTENT_RECHECK_MS = 1_000L",
              "capture constants anchor",
          )

          screen.write_text(text)
          PY
            rm -rf .agent
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Commit applied app-share fix
        if: github.event_name == 'push' && steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore app screen sharing safely"
          git push origin HEAD:agent/fix-black-screen-renderer-lifecycle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unora-app-share-fix-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
